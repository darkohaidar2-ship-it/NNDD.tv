<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Deep Obsidian Dark Radial Background -->
    <radialGradient id="obsidianBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0B1A30" />
      <stop offset="50%" stop-color="#050C17" />
      <stop offset="100%" stop-color="#02050A" />
    </radialGradient>

    <!-- Play Triangle Specular Gradient -->
    <linearGradient id="triangleGrad" x1="220" y1="160" x2="300" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Cyan Rim Highlight Gradient -->
    <linearGradient id="rimBorder" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glowing Cyan / Blue Broadcast Drop Shadow -->
    <filter id="broadcastGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00E5FF" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="20" flood-color="#0284C7" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <filter id="wordmarkGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00E5FF" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Dark Obsidian Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#obsidianBg)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#rimBorder)" stroke-width="4" />

  <!-- Ambient Internal Blue Nebula Aura -->
  <circle cx="256" cy="205" r="140" fill="#00E5FF" opacity="0.12" filter="blur(35px)" />
  <circle cx="256" cy="205" r="90" fill="#0284C7" opacity="0.2" filter="blur(25px)" />

  {/* =========================================================================
      PART 1: BROADCAST PLAY-WAVE EMBLEM (cx = 256, cy = 205)
     ========================================================================= */}
  <g filter="url(#broadcastGlow)">
    <!-- Outermost Concentric Wave Arcs (r = 135) -->
    <g opacity="0.48">
      <!-- Left Outer Arc -->
      <path 
        d="M 169.22 308.42 A 135 135 0 0 1 169.22 101.58" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="4" 
        stroke-linecap="round" 
      />
      <!-- Top-Right Outer Arc -->
      <path 
        d="M 331.49 93.08 A 135 135 0 0 1 384.39 163.28" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="4" 
        stroke-linecap="round" 
      />
      <!-- Bottom-Right Outer Arc -->
      <path 
        d="M 384.39 246.72 A 135 135 0 0 1 331.49 316.92" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="4" 
        stroke-linecap="round" 
      />
    </g>

    <!-- Middle Concentric Wave Arcs (r = 108) -->
    <g opacity="0.78">
      <!-- Left Middle Arc -->
      <path 
        d="M 198.77 296.59 A 108 108 0 0 1 198.77 113.41" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="6" 
        stroke-linecap="round" 
      />
      <!-- Top-Right Middle Arc -->
      <path 
        d="M 303.34 107.93 A 108 108 0 0 1 358.71 171.63" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="6" 
        stroke-linecap="round" 
      />
      <!-- Bottom-Right Middle Arc -->
      <path 
        d="M 358.71 238.37 A 108 108 0 0 1 303.34 302.07" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="6" 
        stroke-linecap="round" 
      />
    </g>

    <!-- Inner Thick Glowing Broadcast Crescent (r = 82, stroke = 16) -->
    <path 
      d="M 323.98 159.15 A 82 82 0 1 0 323.98 250.85" 
      fill="none" 
      stroke="#FFFFFF" 
      stroke-width="16" 
      stroke-linecap="round" 
    />

    <!-- Rounded Play Triangle (Centered at cx = 256, cy = 205) -->
    <path 
      d="M 226 158 C 226 152 232.5 148 238.5 151.5 L 299.5 198.5 C 305 202 305 208 299.5 211.5 L 238.5 258.5 C 232.5 262 226 258 226 252 Z" 
      fill="url(#triangleGrad)" 
      stroke="#FFFFFF" 
      stroke-width="6" 
      stroke-linejoin="round" 
    />
  </g>

  {/* =========================================================================
      PART 2: TYPOGRAPHY NNDD.TV (Centered Horizontally across x = 76 to 436, y = 370..434)
     ========================================================================= */}
  <g fill="#FFFFFF" filter="url(#wordmarkGlow)">
    <!-- Letter N (1): x = 78..134 -->
    <path d="M 78 432 L 78 368 L 95 368 L 120 410 L 120 368 L 135 368 L 135 432 L 118 432 L 93 390 L 93 432 Z" />

    <!-- Letter N (2): x = 149..205 -->
    <path d="M 149 432 L 149 368 L 166 368 L 191 410 L 191 368 L 206 368 L 206 432 L 189 432 L 164 390 L 164 432 Z" />

    <!-- Letter D (1): x = 220..280 -->
    <path d="M 220 368 L 251 368 C 268 368 282 382 282 400 C 282 418 268 432 251 432 L 220 432 Z M 235 383 L 235 417 L 251 417 C 260 417 267 409 267 400 C 267 391 260 383 251 383 Z" />

    <!-- Letter D (2): x = 293..353 -->
    <path d="M 293 368 L 324 368 C 341 368 355 382 355 400 C 355 418 341 432 324 432 L 293 432 Z M 308 383 L 308 417 L 324 417 C 333 417 340 409 340 400 C 340 391 333 383 324 383 Z" />

    <!-- Bold Baseline Dot (.): x = 363..376 -->
    <rect x="363" y="418" width="14" height="14" rx="3" />

    <!-- Subscript Letter T: x = 388..418 -->
    <path d="M 388 388 L 420 388 L 420 397 L 409 397 L 409 432 L 399 432 L 399 397 L 388 397 Z" />

    <!-- Subscript Letter V: x = 426..460 -->
    <path d="M 426 388 L 437 388 L 443 419 L 449 388 L 460 388 L 448 432 L 438 432 Z" />
  </g>
</svg>