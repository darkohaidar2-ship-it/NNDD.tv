<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="obsidianBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="prismA" x1="120" y1="100" x2="420" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#00A8FF" />
      <stop offset="100%" stop-color="#0052D4" />
    </linearGradient>
    <linearGradient id="prismB" x1="140" y1="120" x2="380" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="prismC" x1="200" y1="256" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="prismSpecular" x1="150" y1="120" x2="360" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#E0F2FE" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="rimBorder" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.4" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00F2FE" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Dark Obsidian Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#obsidianBg)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#rimBorder)" stroke-width="4" />

  <!-- Ambient Internal Blue Nebula Glow -->
  <circle cx="256" cy="256" r="140" fill="#0284C7" opacity="0.18" filter="blur(30px)" />

  <!-- Radiating Broadcast Wave Accents -->
  <path d="M 120 160 A 180 180 0 0 0 120 352" fill="none" stroke="#00F2FE" stroke-width="12" stroke-linecap="round" opacity="0.75" />
  <path d="M 80 128 A 230 230 0 0 0 80 384" fill="none" stroke="#00F2FE" stroke-width="8" stroke-linecap="round" opacity="0.4" />
  <path d="M 330 130 A 180 180 0 0 1 400 200" fill="none" stroke="#00F2FE" stroke-width="12" stroke-linecap="round" opacity="0.6" />
  <path d="M 400 312 A 180 180 0 0 1 330 382" fill="none" stroke="#00F2FE" stroke-width="12" stroke-linecap="round" opacity="0.6" />

  <!-- 3D Crystal Prism Play Button -->
  <g filter="url(#neonGlow)">
    <!-- Base Triangular Prism -->
    <path d="M 180 136 C 170 130 160 135 160 148 L 160 364 C 160 377 170 382 180 376 L 360 268 C 370 262 370 250 360 244 Z" fill="url(#prismA)" />
    <!-- Upper Facet -->
    <path d="M 160 148 L 260 256 L 360 244 L 180 136 C 170 130 160 135 160 148 Z" fill="url(#prismB)" />
    <!-- Lower Facet -->
    <path d="M 160 364 L 260 256 L 360 268 L 180 376 C 170 382 160 377 160 364 Z" fill="url(#prismC)" />
    <!-- Specular Highlight Bevel -->
    <path d="M 168 148 L 350 250 L 260 256 Z" fill="url(#prismSpecular)" />
    <!-- Inner Hollow Accent -->
    <path d="M 198 186 L 316 256 L 198 326 Z" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity="0.9" />
    <circle cx="230" cy="256" r="10" fill="#FFFFFF" opacity="0.95" />
  </g>
</svg>